name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
      - run: composer validate --strict
      - run: composer test:ci
      - run: composer test:release
      - run: composer check-platform-reqs

  webhook-databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: mysql/mysql-server:8.0
            driver: mysql
            port: 3306
            user: root
            health: mysqladmin ping -h 127.0.0.1 -pmono-test-only
          - image: mariadb:10.5
            driver: mysql
            port: 3306
            user: root
            health: mysqladmin ping -h 127.0.0.1 -pmono-test-only
          - image: postgres:16
            driver: pgsql
            port: 5432
            user: postgres
            health: pg_isready -U postgres -d mono_test
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: mono-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: mono_test
          POSTGRES_PASSWORD: mono-test-only
          POSTGRES_DB: mono_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, pdo_mysql, pdo_pgsql
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
      - run: php vendor/bin/phpunit --fail-on-skipped tests/Integration/OutboxWorkerTest.php
        env:
          MONO_WEBHOOK_TEST_DSN: '${{ matrix.driver }}:host=127.0.0.1;port=${{ matrix.port }};dbname=mono_test'
          MONO_WEBHOOK_TEST_USER: ${{ matrix.user }}
          MONO_WEBHOOK_TEST_PASSWORD: mono-test-only

  macos-examples:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
      - run: php vendor/bin/phpunit --fail-on-skipped tests/Integration/ComposerConsumerTest.php

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring, openssl, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
      - run: composer analyse
      - run: composer cs
      - run: composer audit

  lowest-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.0'
          extensions: curl, json, mbstring, openssl, pdo_sqlite
          coverage: none
      - run: composer update --prefer-lowest --prefer-stable --no-interaction
      - run: composer test:ci

  optional-extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, pdo_sqlite, :curl, :openssl
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
      - run: composer test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: curl, json, mbstring, openssl, pdo_sqlite
          coverage: pcov
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4.0.0
      - run: mkdir -p build
      - run: composer test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: build/coverage.xml
